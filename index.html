<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코워크시티 · YouTube 셀프 리포트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" as="style" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F4EC;
  --panel:#FFFFFF;
  --ink:#0E120F;
  --mute:#6E6A60;
  --line:#E6DFCE;
  --brand:#0F4D38;
  --brand-deep:#093225;
  --brand-soft:#D9E6DF;
  --gold:#B8801F;
  --neg:#C8442C;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:'Pretendard','Inter','Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding:48px 32px 80px}
.serif{font-family:'Noto Serif KR','Pretendard',serif}

/* HEADER */
.header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:24px 0 28px;border-bottom:1px solid var(--line);margin-bottom:24px}
.brand{display:flex;align-items:center;gap:18px}
.logo{width:64px;height:64px;background:var(--brand-deep);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif KR',serif;font-weight:900;font-size:36px;position:relative;border:2px solid var(--gold)}
.logo::before,.logo::after{content:'';position:absolute;width:8px;height:1px;background:rgba(255,255,255,0.35);top:50%}
.logo::before{left:-12px}
.logo::after{right:-12px}
.brand-text{display:flex;flex-direction:column;gap:2px}
.brand-name{font-family:'Noto Serif KR',serif;font-weight:900;font-size:22px;letter-spacing:-0.02em}
.brand-sub{font-size:13px;color:var(--mute);letter-spacing:0.02em}
.brand-handle{font-size:12px;color:var(--brand);font-weight:700;text-decoration:none}
.brand-handle:hover{text-decoration:underline}
.header-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:13px;color:var(--mute)}
.period-chip{background:var(--brand);color:#fff;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:0.06em}

/* PERIOD TABS */
.period-tabs{display:flex;gap:6px;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:36px;flex-wrap:wrap;align-items:center}
.ptab{position:relative;padding:10px 18px;border:none;background:transparent;font-family:inherit;font-size:14px;font-weight:700;color:var(--mute);border-radius:8px;cursor:pointer;letter-spacing:-0.01em;transition:background .12s, color .12s}
.ptab:hover{background:var(--bg);color:var(--ink)}
.ptab.active{background:var(--brand);color:#fff}
.ptab.active:hover{background:var(--brand-deep);color:#fff}
.ptab .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--gold);margin-left:6px;vertical-align:1px}
.ptab.no-data .dot{background:#D1CBB7}
.ptab.no-data{color:#B5B0A2}
.ptab.no-data.active{background:#5A6E62;color:#fff}
.ptab-sep{flex:1}
.ptab.ptab-custom{border:1px dashed var(--line)}
.ptab.ptab-custom.active{border-color:var(--brand);background:var(--brand);color:#fff}
.custom-row{display:none;gap:10px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:-24px 0 36px;align-items:center;flex-wrap:wrap}
.custom-row.open{display:flex}
.custom-row label{font-size:12px;color:var(--mute);font-weight:700;letter-spacing:0.06em;text-transform:uppercase}
.custom-row input[type=date]{font:inherit;font-size:14px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.custom-row button{font:inherit;font-size:13px;font-weight:700;padding:9px 18px;background:var(--brand);color:#fff;border:none;border-radius:8px;cursor:pointer}
.custom-row button:hover{background:var(--brand-deep)}
.custom-row .hint{font-size:12px;color:var(--mute);margin-left:6px}

/* SECTION TITLE */
.section{margin-bottom:48px}
.section-head{display:flex;align-items:baseline;gap:14px;margin-bottom:18px}
.section-num{font-family:'Noto Serif KR',serif;font-weight:900;font-size:28px;color:var(--gold)}
.section-title{font-family:'Noto Serif KR',serif;font-weight:900;font-size:24px;letter-spacing:-0.02em}
.section-sub{font-size:13px;color:var(--mute);margin-left:auto}

/* NORTH STAR — 큰 숫자 카드 그리드 */
.ns-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.ns-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px 22px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.ns-card.hero{background:var(--brand);color:#fff;border-color:var(--brand)}
.ns-card.hero .ns-label,.ns-card.hero .ns-vs{color:rgba(255,255,255,0.75)}
.ns-card.hero .ns-sub{color:rgba(255,255,255,0.6)}
.ns-card.empty{background:repeating-linear-gradient(135deg,#fff 0 12px,#FBF7EC 12px 24px);border-style:dashed}
.ns-card.empty .ns-value{color:#C4BEA8;font-size:32px;letter-spacing:0;font-weight:700}
.ns-card.empty .ns-vs::before{background:#D1CBB7}
.ns-label{font-size:12px;color:var(--mute);letter-spacing:0.18em;text-transform:uppercase;font-weight:700}
.ns-value{font-family:'Inter','Pretendard',sans-serif;font-weight:900;font-size:54px;letter-spacing:-0.04em;line-height:1}
.ns-vs{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}
.ns-vs::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--gold);display:inline-block}
.ns-sub{font-size:11px;color:#999;letter-spacing:0.02em;margin-top:4px}

/* VERDICT */
.verdict{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--gold);border-radius:14px;padding:24px 28px;display:flex;flex-direction:column;gap:8px}
.verdict.empty{border-left-color:#D1CBB7;background:repeating-linear-gradient(135deg,#fff 0 12px,#FBF7EC 12px 24px)}
.verdict-tag{font-size:11px;font-weight:700;letter-spacing:0.18em;color:var(--gold);text-transform:uppercase}
.verdict.empty .verdict-tag{color:#B5B0A2}
.verdict-head{font-family:'Noto Serif KR',serif;font-weight:900;font-size:28px;letter-spacing:-0.02em}
.verdict.empty .verdict-head{color:#B5B0A2;font-size:22px}
.verdict-detail{font-size:15px;color:var(--mute);line-height:1.6}
.verdict-source{margin-top:6px;font-size:11px;color:#999;letter-spacing:0.08em}

/* TOP CONTENT — split shorts vs long */
.top-split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.top-col{display:flex;flex-direction:column;gap:10px}
.top-col-head{display:flex;align-items:baseline;gap:10px;padding:0 4px}
.top-col-head .ic{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:900}
.top-col-head .ic.short{background:var(--neg)}
.top-col-head .ic.long{background:#2B5273}
.top-col-head .ttl{font-family:'Noto Serif KR',serif;font-weight:900;font-size:18px;letter-spacing:-0.02em}
.top-col-head .sub{font-size:11px;color:var(--mute);letter-spacing:0.10em;text-transform:uppercase;font-weight:700;margin-left:auto}
.top-list{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;flex:1}
.top-row{display:grid;grid-template-columns:36px 1fr 90px;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line)}
.top-row:last-child{border-bottom:none}
.top-row.placeholder{display:block;padding:24px 22px;color:var(--mute);font-size:13px;text-align:center;line-height:1.7;background:#FBF7EC}
.top-row.placeholder strong{color:var(--ink);font-weight:700}
.top-rank{font-family:'Noto Serif KR',serif;font-weight:900;font-size:24px;color:var(--brand);line-height:1;text-align:center}
.top-rank.star{color:var(--gold)}
.top-title{display:flex;flex-direction:column;gap:3px;min-width:0}
.top-title .t{font-size:14px;font-weight:600;letter-spacing:-0.01em;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.top-title .m{font-size:10px;color:var(--mute);letter-spacing:0.06em;text-transform:uppercase;font-weight:700}
.top-num{font-family:'Inter',sans-serif;font-weight:900;font-size:18px;text-align:right;letter-spacing:-0.02em;line-height:1.2}
.top-num .u{font-size:10px;color:var(--mute);font-weight:600;letter-spacing:0.08em;display:block}

/* VIDEO REACH COMPARISON */
.vid-grid{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.vid-row{display:grid;grid-template-columns:36px 1fr 70px 220px 90px 90px;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid var(--line)}
.vid-row:last-child{border-bottom:none}
.vid-row.head{background:#FBF8F0;font-size:11px;color:var(--mute);font-weight:700;letter-spacing:0.14em;text-transform:uppercase;padding:12px 22px}
.vid-row.gold{background:linear-gradient(90deg,rgba(184,128,31,0.06),transparent)}
.vid-rank{font-family:'Noto Serif KR',serif;font-weight:900;font-size:22px;color:var(--brand);line-height:1;text-align:center}
.vid-rank.star{color:var(--gold)}
.vid-title{display:flex;flex-direction:column;gap:4px;min-width:0}
.vid-title .t{font-size:15px;font-weight:600;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vid-title .m{font-size:11px;color:var(--mute);letter-spacing:0.04em;display:flex;gap:10px}
.vid-title .tag{font-size:10px;font-weight:800;letter-spacing:0.10em;color:var(--brand);background:var(--brand-soft);padding:2px 6px;border-radius:4px;text-transform:uppercase}
.vid-dur{font-family:'Inter',sans-serif;font-size:13px;font-weight:600;color:var(--mute);text-align:right}
.vid-bar-wrap{display:flex;align-items:center;gap:10px}
.vid-bar{height:8px;background:var(--brand-soft);border-radius:4px;flex:1;overflow:hidden}
.vid-bar-fill{height:100%;background:var(--brand);border-radius:4px}
.vid-bar-fill.gold{background:var(--gold)}
.vid-ctr{font-family:'Inter',sans-serif;font-weight:900;font-size:18px;letter-spacing:-0.02em;width:62px;text-align:right}
.vid-num{font-family:'Inter',sans-serif;font-weight:800;font-size:17px;text-align:right;letter-spacing:-0.02em}

/* INSIGHT CALLOUT */
.callout{background:linear-gradient(135deg,#0F4D38 0%,#093225 100%);color:#fff;border-radius:14px;padding:26px 30px;display:flex;flex-direction:column;gap:10px;margin-top:18px;position:relative;overflow:hidden}
.callout::before{content:'';position:absolute;right:-40px;top:-40px;width:200px;height:200px;background:radial-gradient(closest-side,rgba(184,128,31,0.25),transparent);border-radius:50%}
.callout-tag{font-size:11px;font-weight:800;letter-spacing:0.20em;color:var(--gold);text-transform:uppercase;position:relative}
.callout-title{font-family:'Noto Serif KR',serif;font-weight:900;font-size:24px;letter-spacing:-0.02em;position:relative}
.callout-body{font-size:14px;line-height:1.65;color:rgba(255,255,255,0.85);position:relative}
.callout-action{font-size:13px;color:#fff;font-weight:700;padding:8px 0 0;border-top:1px solid rgba(255,255,255,0.15);margin-top:4px;position:relative}
.callout-action::before{content:'→ ';color:var(--gold);font-weight:900}

/* HYPOTHESES */
.hyp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.hyp-card{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px;min-height:140px}
.hyp-id{font-family:'Noto Serif KR',serif;font-weight:900;font-size:20px;color:var(--gold);letter-spacing:0.04em}
.hyp-text{font-size:14px;color:var(--ink);line-height:1.5;flex:1}
.hyp-text.empty{color:var(--mute);font-style:italic}
.hyp-status{font-size:10px;font-weight:800;letter-spacing:0.18em;color:var(--mute);text-transform:uppercase;align-self:flex-start;padding:3px 8px;border:1px solid var(--line);border-radius:99px}

/* FOOTER */
.footer{margin-top:60px;padding-top:28px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute)}
.footer a{color:var(--brand);text-decoration:none}

/* responsive */
@media (max-width: 900px){
  .ns-grid{grid-template-columns:repeat(2,1fr)}
  .hyp-grid{grid-template-columns:1fr}
  .top-split{grid-template-columns:1fr;gap:24px}
  .vid-row{grid-template-columns:30px 1fr 70px 110px;gap:10px;padding:14px 16px}
  .vid-row > .vid-num{display:none}
  .vid-row.head{grid-template-columns:30px 1fr 70px 110px}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- HEADER -->
  <header class="header" id="header"></header>

  <!-- PERIOD TABS -->
  <nav class="period-tabs" id="period-tabs"></nav>
  <div class="custom-row" id="custom-row">
    <label>FROM</label>
    <input type="date" id="cd-from">
    <label>TO</label>
    <input type="date" id="cd-to">
    <button id="cd-apply">적용</button>
    <span class="hint">기간 선택 후 적용 — 해당 기간 Studio 스샷이 들어오면 자동 반영</span>
  </div>

  <!-- 01 NORTH STAR METRICS -->
  <section class="section">
    <div class="section-head">
      <div class="section-num">01</div>
      <div class="section-title">북극성 지표 <span id="ns-period-label" style="font-weight:400;color:var(--mute);font-family:'Pretendard',sans-serif;font-size:15px"></span></div>
      <div class="section-sub" id="period-display"></div>
    </div>
    <div class="ns-grid" id="ns-grid"></div>
  </section>

  <!-- 02 STUDIO VERDICT -->
  <section class="section">
    <div class="section-head">
      <div class="section-num">02</div>
      <div class="section-title">Studio 평가</div>
      <div class="section-sub">YouTube 자동 코멘트</div>
    </div>
    <div id="verdict-wrap"></div>
  </section>

  <!-- 03 TOP CONTENT — split shorts vs long -->
  <section class="section">
    <div class="section-head">
      <div class="section-num">03</div>
      <div class="section-title">TOP 콘텐츠</div>
      <div class="section-sub" id="rt-views"></div>
    </div>
    <div class="top-split">
      <div class="top-col">
        <div class="top-col-head">
          <span class="ic short">S</span>
          <span class="ttl">TOP 쇼츠</span>
          <span class="sub">지난 48시간</span>
        </div>
        <div class="top-list" id="top-shorts"></div>
      </div>
      <div class="top-col">
        <div class="top-col-head">
          <span class="ic long">▶</span>
          <span class="ttl">TOP 일반 영상</span>
          <span class="sub">누적 조회</span>
        </div>
        <div class="top-list" id="top-longs"></div>
      </div>
    </div>
  </section>

  <!-- 04 VIDEO REACH COMPARISON -->
  <section class="section">
    <div class="section-head">
      <div class="section-num">04</div>
      <div class="section-title">영상별 도달범위 비교</div>
      <div class="section-sub" id="vid-note"></div>
    </div>
    <div class="vid-grid" id="vid-grid"></div>
    <div class="callout" id="callout"></div>
  </section>

  <!-- 05 HYPOTHESES TRACKER -->
  <section class="section">
    <div class="section-head">
      <div class="section-num">05</div>
      <div class="section-title">다음 영상 가설 트래커</div>
      <div class="section-sub">data.js에서 직접 편집</div>
    </div>
    <div class="hyp-grid" id="hyp-grid"></div>
  </section>

  <footer class="footer">
    <div>코워크시티 · YouTube 셀프 리포트</div>
    <div>업데이트: <span id="updated-at"></span></div>
  </footer>

</div>

<script src="data.js"></script>
<script>
const data = window.REPORT_DATA;
const PERIOD_ORDER = ["d7","d28","d90","d365","ltm","custom"];
let currentKey = data.current_period || "d28";

function fmt(n){
  if (n >= 10000) return (n/10000).toFixed(n%10000===0?0:1).replace(/\.0$/,'') + '만';
  if (n >= 1000) return n.toLocaleString();
  return String(n);
}

function renderHeader(){
  document.getElementById('header').innerHTML = `
    <div class="brand">
      <div class="logo">${data.channel.logo_letter}</div>
      <div class="brand-text">
        <div class="brand-name">${data.channel.name}</div>
        <div class="brand-sub">${data.channel.tagline}</div>
        <a class="brand-handle" href="${data.channel.url}" target="_blank" rel="noopener">${data.channel.handle} ↗</a>
      </div>
    </div>
    <div class="header-right" id="header-right"></div>
  `;
  renderHeaderRight();
}

function renderHeaderRight(){
  const p = data.periods[currentKey];
  const range = (p.from && p.to) ? `${p.from} ~ ${p.to}` : '기간 데이터 미입력';
  document.getElementById('header-right').innerHTML = `
    <div class="period-chip">${p.label}</div>
    <div>${range}</div>
  `;
}

function renderTabs(){
  const tabs = PERIOD_ORDER.map(key => {
    const p = data.periods[key];
    const hasData = !!p.data;
    const active = key === currentKey;
    const cls = `ptab ${active?'active':''} ${hasData?'':'no-data'} ${key==='custom'?'ptab-custom':''}`;
    const label = (key==='custom' && p.from && p.to) ? `${p.from} ~ ${p.to}` : p.label;
    const icon = key==='custom' ? '📅 ' : '';
    return `<button class="${cls}" data-key="${key}">${icon}${label}<span class="dot"></span></button>`;
  });
  document.getElementById('period-tabs').innerHTML =
    tabs.slice(0,5).join('') +
    `<div class="ptab-sep"></div>` +
    tabs[5];

  document.querySelectorAll('.ptab').forEach(btn => {
    btn.addEventListener('click', () => {
      const k = btn.getAttribute('data-key');
      currentKey = k;
      if (k === 'custom') {
        document.getElementById('custom-row').classList.add('open');
      } else {
        document.getElementById('custom-row').classList.remove('open');
      }
      renderAll();
    });
  });
}

function renderMetrics(){
  const p = data.periods[currentKey];
  document.getElementById('ns-period-label').textContent = `· ${p.label}`;
  document.getElementById('period-display').textContent =
    (p.from && p.to) ? `${p.from} ~ ${p.to}` : '데이터 미입력 기간';

  const heroSubs = `
    <div class="ns-card hero">
      <div class="ns-label">구독자</div>
      <div class="ns-value">${fmt(data.channel.totals.subscribers)}</div>
      <div class="ns-vs">현재 채널 총합</div>
      <div class="ns-sub">영상 ${data.channel.totals.videos}개 누적</div>
    </div>`;

  if (!p.data) {
    document.getElementById('ns-grid').innerHTML = heroSubs + `
      <div class="ns-card empty">
        <div class="ns-label">조회수</div>
        <div class="ns-value">—</div>
        <div class="ns-vs">${p.label} 스샷 필요</div>
        <div class="ns-sub">YouTube Studio → 채널 분석 → ${p.label} 선택 후 캡처</div>
      </div>
      <div class="ns-card empty">
        <div class="ns-label">시청 시간</div>
        <div class="ns-value">—</div>
        <div class="ns-vs">${p.label} 스샷 필요</div>
        <div class="ns-sub">기본 위젯 두 번째 카드</div>
      </div>
      <div class="ns-card empty">
        <div class="ns-label">신규 구독자</div>
        <div class="ns-value">—</div>
        <div class="ns-vs">${p.label} 스샷 필요</div>
        <div class="ns-sub">기본 위젯 세 번째 카드</div>
      </div>
    `;
    return;
  }

  const m = p.data;
  document.getElementById('ns-grid').innerHTML = heroSubs + `
    <div class="ns-card">
      <div class="ns-label">조회수</div>
      <div class="ns-value">${m.views.display}</div>
      <div class="ns-vs">${m.views.vs_norm}</div>
      <div class="ns-sub">${m.views.norm_range?`평소 범위 ${m.views.norm_range}`:p.label+' 누적'}</div>
    </div>
    <div class="ns-card">
      <div class="ns-label">시청 시간</div>
      <div class="ns-value">${m.watch_time_hours.display}</div>
      <div class="ns-vs">${m.watch_time_hours.vs_norm}</div>
      <div class="ns-sub">${p.label} 누적</div>
    </div>
    <div class="ns-card">
      <div class="ns-label">신규 구독자</div>
      <div class="ns-value">${m.new_subscribers.display}</div>
      <div class="ns-vs">${m.new_subscribers.vs_norm}</div>
      <div class="ns-sub">${p.label} 순증</div>
    </div>
  `;
}

function renderVerdict(){
  const p = data.periods[currentKey];
  const v = p.verdict;
  if (!v) {
    document.getElementById('verdict-wrap').innerHTML = `
      <div class="verdict empty">
        <div class="verdict-tag">Studio 시그널</div>
        <div class="verdict-head">${p.label} 데이터 미입력</div>
        <div class="verdict-detail">YouTube Studio에서 ${p.label} 기간 선택 후 채널 분석 개요 화면 스샷을 보내주시면 자동으로 채워집니다.</div>
      </div>`;
    return;
  }
  document.getElementById('verdict-wrap').innerHTML = `
    <div class="verdict">
      <div class="verdict-tag">Studio 시그널</div>
      <div class="verdict-head">"${v.headline}"</div>
      <div class="verdict-detail">${v.detail}</div>
      <div class="verdict-source">— YouTube Studio · 채널 분석 · ${p.label}</div>
    </div>`;
}

function renderTopContent(){
  document.getElementById('rt-views').textContent = `누적 조회수 기준 · 실시간 48h 채널 조회 ${data.realtime.views_48h.toLocaleString()}`;

  // TOP SHORTS — 누적 조회수
  const sv = data.top_shorts.videos;
  if (!sv || sv.length === 0) {
    document.getElementById('top-shorts').innerHTML = `
      <div class="top-row placeholder" style="padding:40px 22px;text-align:center">
        <strong>쇼츠 누적 조회수 미입력</strong><br><br>
        YouTube Studio 좌측 메뉴 <strong>[콘텐츠]</strong> 클릭 → 영상 표 한 장이면<br>
        쇼츠·일반 영상 27개 누적 조회수가 한 번에 채워집니다.
      </div>`;
  } else {
    const sortedShorts = [...sv].sort((a,b) => b.views_cumulative - a.views_cumulative);
    document.getElementById('top-shorts').innerHTML = sortedShorts.map((s, i) => `
      <div class="top-row">
        <div class="top-rank ${i===0?'star':''}">${i===0?'★':i+1}</div>
        <div class="top-title">
          <div class="t">${s.title}</div>
          <div class="m">SHORTS · 게시 후 ${s.published_days_ago}일</div>
        </div>
        <div class="top-num">${s.views_display}<span class="u">회 (누적)</span></div>
      </div>`).join('');
  }

  // TOP LONG — 영상별 도달범위에서 누적 조회수 기준 정렬
  const longs = [...data.video_reach.videos].sort((a,b) => b.views - a.views);
  const longRows = longs.map((v, i) => `
    <div class="top-row">
      <div class="top-rank ${i===0?'star':''}">${i===0?'★':i+1}</div>
      <div class="top-title">
        <div class="t">${v.title}</div>
        <div class="m">${v.duration} · 게시 후 ${v.days_since_published}일</div>
      </div>
      <div class="top-num">${v.views_display}<span class="u">회 (누적)</span></div>
    </div>`).join('');
  const longFooter = `
    <div class="top-row placeholder">
      현재 ${longs.length}개 영상 표시. <strong>콘텐츠 탭 리스트</strong>로 전체 ${data.channel.totals.videos}개 확장 가능.
    </div>`;
  document.getElementById('top-longs').innerHTML = longRows + longFooter;
}

function renderVideoReach(){
  document.getElementById('vid-note').textContent = data.video_reach.note;
  const maxCtr = Math.max(...data.video_reach.videos.map(v => v.ctr_pct));
  const sorted = [...data.video_reach.videos].sort((a,b) => b.ctr_pct - a.ctr_pct);
  const head = `
    <div class="vid-row head">
      <div>#</div>
      <div>제목</div>
      <div style="text-align:right">길이</div>
      <div>CTR</div>
      <div style="text-align:right">노출수</div>
      <div style="text-align:right">조회수</div>
    </div>`;
  const rows = sorted.map((v, i) => {
    const pct = (v.ctr_pct / maxCtr) * 100;
    const isGold = v.highlight && i < 2;
    return `
      <div class="vid-row ${isGold?'gold':''}">
        <div class="vid-rank ${i===0?'star':''}">${i===0?'★':i+1}</div>
        <div class="vid-title">
          <div class="t">${v.title}</div>
          <div class="m">
            <span class="tag">${v.topic_tag}</span>
            <span>게시 후 ${v.days_since_published}일</span>
            <span>순 시청 ${v.unique_viewers_display}</span>
          </div>
        </div>
        <div class="vid-dur">${v.duration}</div>
        <div class="vid-bar-wrap">
          <div class="vid-bar"><div class="vid-bar-fill ${isGold?'gold':''}" style="width:${pct}%"></div></div>
          <div class="vid-ctr">${v.ctr_pct.toFixed(1)}%</div>
        </div>
        <div class="vid-num">${v.impressions_display}</div>
        <div class="vid-num">${v.views_display}</div>
      </div>`;
  }).join('');
  document.getElementById('vid-grid').innerHTML = head + rows;
  document.getElementById('callout').innerHTML = `
    <div class="callout-tag">Insight</div>
    <div class="callout-title">${data.insight_callout.title}</div>
    <div class="callout-body">${data.insight_callout.body}</div>
    <div class="callout-action">${data.insight_callout.action}</div>
  `;
}

function renderHypotheses(){
  document.getElementById('hyp-grid').innerHTML = data.hypotheses.map(h => {
    const isEmpty = h.text.includes('(') && h.text.includes(')');
    return `
      <div class="hyp-card">
        <div class="hyp-id">${h.id}</div>
        <div class="hyp-text ${isEmpty?'empty':''}">${h.text}</div>
        <div class="hyp-status">${h.status}</div>
      </div>`;
  }).join('');
  document.getElementById('updated-at').textContent = data.updated_at;
}

function applyCustom(){
  const from = document.getElementById('cd-from').value;
  const to   = document.getElementById('cd-to').value;
  if (!from || !to) {
    alert('FROM 과 TO 모두 선택해주세요.');
    return;
  }
  if (from > to) {
    alert('FROM 이 TO 보다 늦을 수 없습니다.');
    return;
  }
  data.periods.custom.from = from;
  data.periods.custom.to = to;
  currentKey = 'custom';
  renderAll();
}

function renderAll(){
  renderHeaderRight();
  renderTabs();
  renderMetrics();
  renderVerdict();
}

// 일회성 렌더
renderHeader();
renderTopContent();
renderVideoReach();
renderHypotheses();
renderAll();

document.getElementById('cd-apply').addEventListener('click', applyCustom);
</script>

</body>
</html>
