<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코워크시티 · YouTube 셀프 리포트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" as="style" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F4EC;
  --panel:#FFFFFF;
  --ink:#0E120F;
  --mute:#6E6A60;
  --line:#E6DFCE;
  --brand:#0F4D38;
  --brand-deep:#093225;
  --brand-soft:#D9E6DF;
  --gold:#B8801F;
  --neg:#C8442C;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:'Pretendard','Inter','Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding:48px 32px 80px}
.serif{font-family:'Noto Serif KR','Pretendard',serif}

/* HEADER */
.header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:24px 0 28px;border-bottom:1px solid var(--line);margin-bottom:24px}
.brand{display:flex;align-items:center;gap:18px}
.logo{width:64px;height:64px;background:var(--brand-deep);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif KR',serif;font-weight:900;font-size:36px;position:relative;border:2px solid var(--gold)}
.logo::before,.logo::after{content:'';position:absolute;width:8px;height:1px;background:rgba(255,255,255,0.35);top:50%}
.logo::before{left:-12px}
.logo::after{right:-12px}
.brand-text{display:flex;flex-direction:column;gap:2px}
.brand-name{font-family:'Noto Serif KR',serif;font-weight:900;font-size:22px;letter-spacing:-0.02em}
.brand-sub{font-size:13px;color:var(--mute);letter-spacing:0.02em}
.brand-handle{font-size:12px;color:var(--brand);font-weight:700;text-decoration:none}
.brand-handle:hover{text-decoration:underline}
.header-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:13px;color:var(--mute)}
.period-chip{background:var(--brand);color:#fff;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:0.06em}

/* PERIOD TABS */
.custom-row{display:flex;gap:10px;padding:14px 18px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:36px;align-items:center;flex-wrap:wrap}
.custom-row .range-label{font-family:'Noto Serif KR',serif;font-weight:900;font-size:15px;letter-spacing:-0.02em;color:var(--ink);margin-right:6px}
.custom-row label{font-size:12px;color:var(--mute);font-weight:700;letter-spacing:0.06em;text-transform:uppercase}
.custom-row input[type=date]{font:inherit;font-size:14px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.custom-row button{font:inherit;font-size:13px;font-weight:700;padding:9px 18px;background:var(--brand);color:#fff;border:none;border-radius:8px;cursor:pointer}
.custom-row button:hover{background:var(--brand-deep)}
.custom-row .hint{font-size:12px;color:var(--mute);margin-left:6px}

/* SECTION TITLE */
.section{margin-bottom:48px}
.section-head{display:flex;align-items:baseline;gap:14px;margin-bottom:18px}
.section-num{font-family:'Noto Serif KR',serif;font-weight:900;font-size:28px;color:var(--gold)}
.section-title{font-family:'Noto Serif KR',serif;font-weight:900;font-size:24px;letter-spacing:-0.02em}
.section-sub{font-size:13px;color:var(--mute);margin-left:auto}

/* NORTH STAR — 큰 숫자 카드 그리드 */
.ns-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.ns-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px 22px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.ns-card.hero{background:var(--brand);color:#fff;border-color:var(--brand)}
.ns-card.hero .ns-label,.ns-card.hero .ns-vs{color:rgba(255,255,255,0.75)}
.ns-card.hero .ns-sub{color:rgba(255,255,255,0.6)}
.ns-card.empty{background:repeating-linear-gradient(135deg,#fff 0 12px,#FBF7EC 12px 24px);border-style:dashed}
.ns-card.empty .ns-value{color:#C4BEA8;font-size:32px;letter-spacing:0;font-weight:700}
.ns-card.empty .ns-vs::before{background:#D1CBB7}
.ns-label{font-size:12px;color:var(--mute);letter-spacing:0.18em;text-transform:uppercase;font-weight:700}
.ns-value{font-family:'Inter','Pretendard',sans-serif;font-weight:900;font-size:54px;letter-spacing:-0.04em;line-height:1}
.ns-vs{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}
.ns-vs::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--gold);display:inline-block}
.ns-sub{font-size:11px;color:#999;letter-spacing:0.02em;margin-top:4px}


/* VIDEO REACH COMPARISON */
.vid-grid{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.vid-row{display:grid;grid-template-columns:36px 1fr 70px 220px 90px 90px;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid var(--line)}
.vid-row:last-child{border-bottom:none}
.vid-row.head{background:#FBF8F0;font-size:11px;color:var(--mute);font-weight:700;letter-spacing:0.14em;text-transform:uppercase;padding:12px 22px}
.vid-row.gold{background:linear-gradient(90deg,rgba(184,128,31,0.06),transparent)}
.vid-rank{font-family:'Noto Serif KR',serif;font-weight:900;font-size:22px;color:var(--brand);line-height:1;text-align:center}
.vid-rank.star{color:var(--gold)}
.vid-title{display:flex;flex-direction:column;gap:4px;min-width:0}
.vid-title .t{font-size:15px;font-weight:600;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vid-title .m{font-size:11px;color:var(--mute);letter-spacing:0.04em;display:flex;gap:10px}
.vid-title .tag{font-size:10px;font-weight:800;letter-spacing:0.10em;color:var(--brand);background:var(--brand-soft);padding:2px 6px;border-radius:4px;text-transform:uppercase}
.vid-dur{font-family:'Inter',sans-serif;font-size:13px;font-weight:600;color:var(--mute);text-align:right}
.vid-bar-wrap{display:flex;align-items:center;gap:10px}
.vid-bar{height:8px;background:var(--brand-soft);border-radius:4px;flex:1;overflow:hidden}
.vid-bar-fill{height:100%;background:var(--brand);border-radius:4px}
.vid-bar-fill.gold{background:var(--gold)}
.vid-ctr{font-family:'Inter',sans-serif;font-weight:900;font-size:18px;letter-spacing:-0.02em;width:62px;text-align:right}
.vid-num{font-family:'Inter',sans-serif;font-weight:800;font-size:17px;text-align:right;letter-spacing:-0.02em}

/* INSIGHT CALLOUT */
.callout{background:linear-gradient(135deg,#0F4D38 0%,#093225 100%);color:#fff;border-radius:14px;padding:26px 30px;display:flex;flex-direction:column;gap:10px;margin-top:18px;position:relative;overflow:hidden}
.callout::before{content:'';position:absolute;right:-40px;top:-40px;width:200px;height:200px;background:radial-gradient(closest-side,rgba(184,128,31,0.25),transparent);border-radius:50%}
.callout-tag{font-size:11px;font-weight:800;letter-spacing:0.20em;color:var(--gold);text-transform:uppercase;position:relative}
.callout-title{font-family:'Noto Serif KR',serif;font-weight:900;font-size:24px;letter-spacing:-0.02em;position:relative}
.callout-body{font-size:14px;line-height:1.65;color:rgba(255,255,255,0.85);position:relative}
.callout-action{font-size:13px;color:#fff;font-weight:700;padding:8px 0 0;border-top:1px solid rgba(255,255,255,0.15);margin-top:4px;position:relative}
.callout-action::before{content:'→ ';color:var(--gold);font-weight:900}


/* FOOTER */
.footer{margin-top:60px;padding-top:28px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute)}
.footer a{color:var(--brand);text-decoration:none}

/* PROMO CONVERSION (CWYT26) */
.promo-chart-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px 26px;margin-top:14px}
.promo-chart-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.promo-chart-title{font-size:11px;font-weight:700;color:var(--mute);letter-spacing:0.14em;text-transform:uppercase}
.promo-chart-legend{display:flex;gap:14px;font-size:11px;color:var(--mute);font-weight:600}
.promo-chart-legend .lg{display:inline-flex;align-items:center;gap:6px}
.promo-chart-legend .sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.promo-svg{width:100%;height:220px;display:block}
.promo-svg .bar-c{fill:var(--brand)}
.promo-svg .bar-p{fill:var(--gold);opacity:0.95}
.promo-svg .axis{stroke:var(--line);stroke-width:1}
.promo-svg .tick{font-family:'Inter',sans-serif;font-size:9px;fill:var(--mute)}
.promo-svg .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:2 3;opacity:0.5}
.promo-meta{display:flex;gap:18px;align-items:center;font-size:12px;color:var(--mute);margin-top:8px;flex-wrap:wrap}
.promo-meta .badge{background:var(--brand-soft);color:var(--brand);padding:3px 10px;border-radius:99px;font-weight:700;font-size:11px;letter-spacing:0.04em}

/* 누적 (전체 기간) 박스 */
.cumul-card{background:var(--brand);color:#fff;border-radius:14px;padding:24px 28px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.cumul-tag{font-size:10px;font-weight:800;letter-spacing:0.22em;text-transform:uppercase;opacity:0.7;margin-bottom:6px}
.cumul-stats{display:flex;gap:36px;align-items:baseline;flex-wrap:wrap}
.cumul-stat{display:flex;flex-direction:column;gap:2px}
.cumul-stat-label{font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;opacity:0.75}
.cumul-stat-value{font-family:'Inter',sans-serif;font-weight:900;font-size:42px;letter-spacing:-0.04em;line-height:1}
.cumul-stat-value .u{font-size:18px;font-weight:700;margin-left:4px;opacity:0.8}
.cumul-meta{font-size:12px;opacity:0.75;line-height:1.6;text-align:right}
.cumul-meta .v{font-weight:800;opacity:1}

/* MoM 변동률 배지 */
.mom-badge{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--brand);border-radius:14px;padding:20px 24px;margin-bottom:14px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.mom-badge.down{border-left-color:var(--neg)}
.mom-badge.flat{border-left-color:var(--mute)}
.mom-head{display:flex;align-items:center;gap:14px}
.mom-arrow{font-family:'Inter',sans-serif;font-weight:900;font-size:34px;line-height:1;color:var(--brand)}
.mom-badge.down .mom-arrow{color:var(--neg)}
.mom-badge.flat .mom-arrow{color:var(--mute)}
.mom-stack{display:flex;flex-direction:column;gap:2px}
.mom-label{font-size:10px;font-weight:800;letter-spacing:0.18em;text-transform:uppercase;color:var(--mute)}
.mom-pct{font-family:'Inter',sans-serif;font-weight:900;font-size:30px;letter-spacing:-0.03em;line-height:1;color:var(--brand)}
.mom-badge.down .mom-pct{color:var(--neg)}
.mom-badge.flat .mom-pct{color:var(--mute)}
.mom-detail{font-size:13px;color:var(--ink);line-height:1.6}
.mom-detail .v{font-weight:800;font-family:'Inter',sans-serif}
.mom-detail .lbl{color:var(--mute);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;font-weight:700;margin-right:4px}
.mom-detail-row + .mom-detail-row{margin-top:2px}

/* LIVE CHANNEL STATS (API) */
.live-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.live-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px 26px;display:flex;flex-direction:column;gap:18px}
.live-head{display:flex;align-items:center;gap:14px}
.live-thumb{width:56px;height:56px;border-radius:50%;background:#eee;object-fit:cover;flex-shrink:0}
.live-meta{flex:1;min-width:0}
.live-title{font-family:'Noto Serif KR',serif;font-weight:900;font-size:18px;letter-spacing:-0.02em;line-height:1.3;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live-handle{font-size:12px;color:var(--mute);font-family:'Inter',sans-serif}
.live-handle a{color:var(--brand);text-decoration:none}
.live-handle a:hover{text-decoration:underline}
.live-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.live-stat-label{font-size:10px;color:var(--mute);letter-spacing:0.16em;text-transform:uppercase;font-weight:700;margin-bottom:4px}
.live-stat-value{font-family:'Inter','Pretendard',sans-serif;font-weight:900;font-size:24px;letter-spacing:-0.03em;color:var(--ink)}
.live-sort{display:flex;gap:6px;padding:2px;background:var(--bg);border:1px solid var(--line);border-radius:99px;width:fit-content;align-self:flex-end}
.live-sort-btn{font-family:'Pretendard',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.04em;padding:6px 14px;border:none;background:transparent;color:var(--mute);border-radius:99px;cursor:pointer;transition:all 0.15s}
.live-sort-btn:hover{color:var(--ink)}
.live-sort-btn.active{background:var(--brand);color:#fff}
.live-section{display:flex;flex-direction:column;gap:2px}
.live-section + .live-section{margin-top:6px}
.live-section-head{font-size:11px;color:var(--mute);letter-spacing:0.14em;text-transform:uppercase;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.live-count{background:var(--brand-soft);color:var(--brand);padding:1px 8px;border-radius:99px;font-size:10px;font-weight:700;letter-spacing:0.02em}
.live-vid{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;align-items:center}
.live-vid:last-child{border-bottom:none}
.live-vid-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.live-vid-title a{color:inherit;text-decoration:none}
.live-vid-title a:hover{color:var(--brand)}
.live-vid-stats{font-family:'Inter',sans-serif;font-size:11px;color:var(--mute);white-space:nowrap}
.live-vid-stats .v{color:var(--ink);font-weight:700}
.live-empty-inline{font-size:12px;color:#B5B0A2;padding:8px 0;font-style:italic}
.live-fetched{font-size:11px;color:var(--mute);letter-spacing:0.04em;font-family:'Inter',sans-serif}
.live-empty{grid-column:1/-1;background:repeating-linear-gradient(135deg,#fff 0 12px,#FBF7EC 12px 24px);border:1px dashed var(--line);border-radius:14px;padding:32px;text-align:center;color:#B5B0A2;font-size:14px}

/* AI 추천 · 창업 핫토픽 */
.ai-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ai-kw-bar{display:flex;gap:8px;padding:14px 20px;border-bottom:1px solid var(--line);background:#FBF7EC;flex-wrap:wrap;align-items:center;font-size:12px}
.ai-kw-bar .lbl{color:var(--mute);font-weight:700;letter-spacing:0.14em;text-transform:uppercase;margin-right:6px}
.ai-kw-bar .kw{background:var(--brand-soft);color:var(--brand);padding:3px 10px;border-radius:99px;font-weight:700;font-size:11px}
.ai-vid-row{display:grid;grid-template-columns:36px 90px 1fr 110px;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line)}
.ai-vid-row:last-child{border-bottom:none}
.ai-vid-row:hover{background:#FBF7EC}
.ai-vid-rank{font-family:'Noto Serif KR',serif;font-weight:900;font-size:22px;color:var(--brand);line-height:1;text-align:center}
.ai-vid-rank.star{color:var(--gold)}
.ai-vid-thumb{width:90px;height:50px;border-radius:6px;object-fit:cover;background:#eee}
.ai-vid-body{min-width:0;display:flex;flex-direction:column;gap:4px}
.ai-vid-title{font-size:14px;font-weight:700;letter-spacing:-0.01em;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai-vid-title a{color:inherit;text-decoration:none}
.ai-vid-title a:hover{color:var(--brand)}
.ai-vid-meta{font-size:11px;color:var(--mute);display:flex;gap:8px;flex-wrap:wrap}
.ai-vid-meta .ch{color:var(--ink);font-weight:600}
.ai-vid-meta .tag{background:var(--bg);color:var(--mute);padding:1px 6px;border-radius:99px;font-size:10px;font-weight:700;letter-spacing:0.04em}
.ai-vid-views{font-family:'Inter',sans-serif;font-weight:900;font-size:16px;text-align:right;letter-spacing:-0.02em;line-height:1.2}
.ai-vid-views .u{font-size:10px;color:var(--mute);font-weight:600;letter-spacing:0.08em;display:block}

/* UTM 유입 카드 */
.utm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.utm-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 24px;display:flex;flex-direction:column;gap:8px}
.utm-card.hero{background:var(--brand-deep);color:#fff;border-color:var(--brand-deep)}
.utm-card.hero .utm-label,.utm-card.hero .utm-sub{color:rgba(255,255,255,0.7)}
.utm-label{font-size:11px;color:var(--mute);letter-spacing:0.18em;text-transform:uppercase;font-weight:700}
.utm-value{font-family:'Inter','Pretendard',sans-serif;font-weight:900;font-size:42px;letter-spacing:-0.04em;line-height:1;color:var(--ink)}
.utm-card.hero .utm-value{color:#fff}
.utm-value .u{font-size:14px;font-weight:700;margin-left:4px;opacity:0.7}
.utm-sub{font-size:11px;color:#999;letter-spacing:0.02em}
.utm-note{margin-top:14px;padding:12px 16px;background:#FBF7EC;border-radius:10px;font-size:12px;color:var(--mute);line-height:1.6}
.utm-note .v{color:var(--ink);font-weight:700}
@media (max-width: 900px){
  .utm-grid{grid-template-columns:repeat(2,1fr)}
}

/* responsive */
@media (max-width: 900px){
  .ns-grid{grid-template-columns:repeat(2,1fr)}
  .vid-row{grid-template-columns:30px 1fr 70px 110px;gap:10px;padding:14px 16px}
  .vid-row > .vid-num{display:none}
  .vid-row.head{grid-template-columns:30px 1fr 70px 110px}
  .promo-svg{height:180px}
  .live-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- HEADER -->
  <header class="header" id="header"></header>

  <!-- DATE RANGE PICKER -->
  <div class="custom-row" id="custom-row">
    <span class="range-label">📅 기간</span>
    <label>FROM</label>
    <input type="date" id="cd-from">
    <label>TO</label>
    <input type="date" id="cd-to">
    <button id="cd-apply">적용</button>
    <span class="hint">CWYT26 차트 + Studio 평가가 선택한 기간으로 좁혀집니다</span>
  </div>

  <!-- 01 YOUTUBE 할인 코드 사용량 (CWYT26) -->
  <section class="section">
    <div class="section-head">
      <div class="section-num">01</div>
      <div class="section-title">유튜브 할인 코드 사용량 <span style="font-weight:400;color:var(--mute);font-family:'Pretendard',sans-serif;font-size:15px">· CWYT26</span></div>
      <div class="section-sub" id="promo-period-label"></div>
    </div>
    <div class="cumul-card" id="cumul-card" style="display:none"></div>
    <div class="mom-badge" id="mom-badge" style="display:none"></div>
    <div class="ns-grid" id="promo-grid"></div>
    <div class="callout" id="promo-callout" style="margin-top:14px"></div>
  </section>

  <!-- 02 LIVE CHANNEL STATS (API) -->
  <section class="section">
    <div class="section-head">
      <div class="section-num">02</div>
      <div class="section-title">채널 라이브 수집 <span style="font-weight:400;color:var(--mute);font-family:'Pretendard',sans-serif;font-size:15px">· YouTube Data API</span></div>
      <div class="section-sub">매일 10/12/14/16/18시 자동 갱신 · 마지막: <span id="yt-fetched-at" class="live-fetched">—</span></div>
    </div>
    <div class="live-grid" id="live-grid"></div>
  </section>

  <!-- 03 VIDEO REACH COMPARISON -->
  <section class="section">
    <div class="section-head">
      <div class="section-num">03</div>
      <div class="section-title">CTR TOP 5</div>
      <div class="section-sub" id="vid-note"></div>
    </div>
    <div class="vid-grid" id="vid-grid"></div>

// 지난달 대비 = 이번달 1일~오늘 vs 지난달 1일~지난달 같은 날짜
function computeMoM(daily){
  const today = new Date();
  const Y = today.getFullYear(), M = today.getMonth(), D = today.getDate();

  const tmFrom = new Date(Y, M, 1);
  const tmTo   = today;

  const lmFrom = new Date(Y, M - 1, 1);
  const lmLastDay = new Date(Y, M, 0).getDate(); // 지난달 말일 수
  const lmTo   = new Date(Y, M - 1, Math.min(D, lmLastDay));

  const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const inRange = (day, from, to) => day >= iso(from) && day <= iso(to);

  const tmRows = daily.filter(r => inRange(r.day, tmFrom, tmTo));
  const lmRows = daily.filter(r => inRange(r.day, lmFrom, lmTo));

  const sum = (arr, k) => arr.reduce((s,r) => s + Number(r[k] || 0), 0);

  const tm = { contracts: sum(tmRows, 'contracts'), paid: sum(tmRows, 'paid') };
  const lm = { contracts: sum(lmRows, 'contracts'), paid: sum(lmRows, 'paid') };

  const pctOf = (curr, prev) => {
    if (prev === 0) return curr > 0 ? null : 0; // null = 신규 (지난달 0건)
    return Math.round((curr - prev) / prev * 100);
  };

  return {
    tm, lm,
    tmLabel: `${M+1}월 1~${D}일`,
    lmLabel: `${M === 0 ? 12 : M}월 1~${Math.min(D, lmLastDay)}일`,
    contractsPct: pctOf(tm.contracts, lm.contracts),
    paidPct: pctOf(tm.paid, lm.paid)
  };
}

function renderPromoSvg(range){
  const svg = document.getElementById('promo-svg');
  const promo = window.PROMO_CWYT26;
  const W = 1200, H = 220, pad = { t: 16, b: 28, l: 36, r: 12 };
  const chartW = W - pad.l - pad.r;
  const chartH = H - pad.t - pad.b;

  const map = new Map();
  promo.daily.forEach(d => map.set(d.day, d));
  const days = [];
  const cur = new Date(range.from + 'T00:00:00');
  const end = new Date(range.to + 'T00:00:00');
  while (cur <= end) {
    const k = fmtDate(cur);
    days.push(map.get(k) || { day: k, contracts: 0, paid: 0 });
    cur.setDate(cur.getDate() + 1);
  }
  if (days.length === 0) { svg.innerHTML = ''; return; }

  const maxV = Math.max(1, ...days.map(d => d.contracts));
  const barW = chartW / days.length;

  const tickCount = Math.min(4, maxV);
  const ticks = [];
  for (let i = 0; i <= tickCount; i++) {
    const v = Math.round(maxV * i / tickCount);
    const y = pad.t + chartH - (v/maxV) * chartH;
    ticks.push({ v, y });
  }
  const gridLines = ticks.map(t =>
    `<line class="grid" x1="${pad.l}" x2="${pad.l + chartW}" y1="${t.y}" y2="${t.y}"/>` +
    `<text class="tick" x="${pad.l - 4}" y="${t.y + 3}" text-anchor="end">${t.v}</text>`
  ).join('');

  const bars = days.map((d, i) => {
    const x = pad.l + i * barW;
    const cH = (d.contracts/maxV) * chartH;
    const pH = (d.paid/maxV) * chartH;
    const w = Math.max(1, barW * 0.4);
    const gap = barW * 0.05;
    return `
      <rect class="bar-c" x="${x + gap}" y="${pad.t + chartH - cH}" width="${w}" height="${cH}" rx="1"/>
      <rect class="bar-p" x="${x + gap + w}" y="${pad.t + chartH - pH}" width="${w}" height="${pH}" rx="1"/>
    `;
  }).join('');

  const xLabelEvery = Math.max(1, Math.ceil(days.length / 8));
  const xLabels = days.map((d, i) => {
    if (i % xLabelEvery !== 0) return '';
    const x = pad.l + i * barW + barW/2;
    return `<text class="tick" x="${x}" y="${H - pad.b + 14}" text-anchor="middle">${d.day.slice(5)}</text>`;
  }).join('');

  const axis = `<line class="axis" x1="${pad.l}" x2="${pad.l + chartW}" y1="${pad.t + chartH}" y2="${pad.t + chartH}"/>`;

  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = gridLines + bars + axis + xLabels;
}

function fmtRelDuration(iso){
  // PT4M59S → 4:59, PT1H2M3S → 1:02:03, PT42S → 0:42
  const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
  if (!m) return '';
  const h = +(m[1]||0), mi = +(m[2]||0), s = +(m[3]||0);
  const pad = n => String(n).padStart(2,'0');
  return h ? `${h}:${pad(mi)}:${pad(s)}` : `${mi}:${pad(s)}`;
}

function escAttr(s){ return String(s).replace(/"/g,'&quot;'); }

  const arr = [...videos];

    arr.sort((a,b) => new Date(b.publishedAt) - new Date(a.publishedAt));
  } else {
    arr.sort((a,b) => b.views - a.views);
  }
  return arr;
}

}

          </div>
          <div>
            <div class="live-stat-label">영상 수</div>
            <div class="live-stat-value">${fmt(c.videoCount)}</div>
          </div>
        </div>

        <div class="live-sort">
          <button class="live-sort-btn active" data-mode="views">조회수순</button>
          <button class="live-sort-btn" data-mode="recent">최신순</button>
        </div>

        <div class="live-section">
          <div class="live-section-head">쇼츠 <span class="live-count">${shorts.length}</span></div>
          <div class="live-shorts-list">${renderVideoList(shorts, DEFAULT_MODE, LIMIT)}</div>
        </div>
        <div class="live-section">
          <div class="live-section-head">롱폼 <span class="live-count">${longs.length}</span></div>
          <div class="live-longs-list">${renderVideoList(longs, DEFAULT_MODE, LIMIT)}</div>
        </div>
      </div>
    `;
  }).join('');

  // 정렬 토글 핸들러
  grid.querySelectorAll('.live-sort-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const card = btn.closest('.live-card');
      const channelIdx = parseInt(card.dataset.channelIdx, 10);
      const mode = btn.dataset.mode;
      const channel = yt.channels[channelIdx];
      const shorts = (channel.recentVideos || []).filter(v => v.isShort);
      const longs  = (channel.recentVideos || []).filter(v => !v.isShort);

      card.dataset.sortMode = mode;
      card.querySelectorAll('.live-sort-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.mode === mode);
      });
      card.querySelector('.live-shorts-list').innerHTML = renderVideoList(shorts, mode, LIMIT);
      card.querySelector('.live-longs-list').innerHTML = renderVideoList(longs, mode, LIMIT);
    });
  });
}

function renderUTM(){
  const grid = document.getElementById('utm-grid');
  const noteEl = document.getElementById('utm-note');
  const fetchedEl = document.getElementById('utm-fetched-at');
  const utm = window.UTM_YOUTUBE_DATA;

  if (!utm){
    fetchedEl.textContent = '—';
    grid.innerHTML = `<div class="live-empty" style="grid-column:1/-1">utm-data.js 미생성</div>`;
    noteEl.style.display = 'none';
    return;
  }

  fetchedEl.textContent = new Date(utm.fetchedAt).toLocaleString('ko-KR');

  grid.innerHTML = `
    <div class="utm-card hero">
      <div class="utm-label">최근 7일</div>
      <div class="utm-value">${fmt(utm.last7d)}<span class="u">명</span></div>
      <div class="utm-sub">신규 유입 유저</div>
    </div>
    <div class="utm-card">
      <div class="utm-label">최근 30일</div>
      <div class="utm-value">${fmt(utm.last30d)}<span class="u">명</span></div>
      <div class="utm-sub">신규 유입 유저</div>
    </div>
    <div class="utm-card">
      <div class="utm-label">최근 90일</div>
      <div class="utm-value">${fmt(utm.last90d)}<span class="u">명</span></div>
      <div class="utm-sub">신규 유입 유저</div>
    </div>
    <div class="utm-card">
      <div class="utm-label">지난 1년</div>
      <div class="utm-value">${fmt(utm.last365d)}<span class="u">명</span></div>
      <div class="utm-sub">${utm.sinceDataStart} 부터 측정</div>
    </div>
  `;

  noteEl.innerHTML = utm.note
    ? `📌 ${utm.note}`
    : `Amplitude의 <span class="v">gp:initial_utm_source</span>가 "youtube"인 유저를 카운트. 최초 유입 기준.`;
}

function renderAITrending(){
  const card = document.getElementById('ai-card');
  const fetchedEl = document.getElementById('ai-fetched-at');
  const yt = window.YOUTUBE_API_DATA;
  const trend = yt?.trendingStartup;

  if (!trend || !trend.videos?.length){
    fetchedEl.textContent = '—';
    card.innerHTML = `<div class="live-empty" style="border:none;padding:32px">데이터 없음 — node fetch-youtube.js 실행 후 채워집니다</div>`;
    return;
  }

  fetchedEl.textContent = `최근 ${trend.lookbackDays}일 · ${new Date(trend.fetchedAt).toLocaleString('ko-KR')}`;

  const kwBar = `
    <div class="ai-kw-bar">
      <span class="lbl">키워드</span>
      ${trend.keywords.map(k => `<span class="kw">${k}</span>`).join('')}
    </div>`;

  const rows = trend.videos.map((v, i) => {
    const days = Math.round((Date.now() - new Date(v.publishedAt)) / 86400000);
    const dayText = days === 0 ? '오늘' : `${days}일 전`;
    const matched = v.matchedKeywords && v.matchedKeywords.length
      ? v.matchedKeywords.map(k => `<span class="tag">${k}</span>`).join('')
      : '';
    return `
      <div class="ai-vid-row">
        <div class="ai-vid-rank ${i===0?'star':''}">${i===0?'★':i+1}</div>
        ${v.thumbnail ? `<img class="ai-vid-thumb" src="${v.thumbnail}" alt="">` : `<div class="ai-vid-thumb"></div>`}
        <div class="ai-vid-body">
          <div class="ai-vid-title"><a href="${v.url}" target="_blank" rel="noopener" title="${escAttr(v.title)}">${v.title}</a></div>
          <div class="ai-vid-meta">
            <span class="ch">${v.channelTitle}</span>
            <span>· ${dayText}</span>
            <span>· ${fmtRelDuration(v.duration)}</span>
            ${matched}
          </div>
        </div>
        <div class="ai-vid-views">${fmt(v.views)}<span class="u">회</span></div>
      </div>`;
  }).join('');

  card.innerHTML = kwBar + rows;
}

function renderAll(){
  renderHeaderRight();
  syncDateInputs();
  renderPromo();
}

// 일회성 렌더
renderHeader();
renderVideoReach();
renderUpdatedAt();
renderLiveChannels();
renderUTM();
renderAITrending();
renderAll();

document.getElementById('cd-apply').addEventListener('click', applyCustom);
